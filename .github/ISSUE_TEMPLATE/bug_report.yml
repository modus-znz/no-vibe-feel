name: Skill or installer bug
description: A skill gave wrong guidance, or install.sh misbehaved.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - install.sh
        - no-vibe-feel
        - no-vibe-feel-writing
        - no-vibe-feel-decisions
        - no-vibe-feel-audit
        - no-vibe-feel-habits
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: e.g. Claude Code 2.x, Cursor 1.x
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the code the skill was pointed at, or the installer output.
    validations:
      required: true
